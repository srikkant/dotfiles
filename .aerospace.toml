config-version = 2
start-at-login = true

persistent-workspaces = ["1", "2", "3", "4", "5", "6"]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.bottom = 4
outer.right = 4
outer.left = 4
outer.top = 4

[workspace-to-monitor-force-assignment]
   1 = "main"
   2 = "main"
   3 = "main"
   4 = "secondary"
   5 = "secondary"
   6 = "secondary"

[mode.main.binding]
    cmd-h = "focus left"
    cmd-j = "focus down"
    cmd-k = "focus up"
    cmd-l = "focus right"
    cmd-shift-h = "move left"
    cmd-shift-j = "move down"
    cmd-shift-k = "move up"
    cmd-shift-l = "move right"
    cmd-1 = "workspace 1"
    cmd-2 = "workspace 2"
    cmd-3 = "workspace 3"
    cmd-4 = "workspace 4"
    cmd-5 = "workspace 5"
	cmd-6 = "workspace 6"
    cmd-shift-1 = "move-node-to-workspace 1"
    cmd-shift-2 = "move-node-to-workspace 2"
    cmd-shift-3 = "move-node-to-workspace 3"
    cmd-shift-4 = "move-node-to-workspace 4"
	cmd-shift-5 = "move-node-to-workspace 5"
    cmd-shift-6 = "move-node-to-workspace 6"