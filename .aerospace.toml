config-version = 2
start-at-login = true

persistent-workspaces = ["1", "2", "3", "4", "5", "6"]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.bottom = 4
outer.right = 4
outer.left = 4
outer.top = 4

[workspace-to-monitor-force-assignment]
   1 = "main"
   2 = "main"
   3 = "main"
   4 = "secondary"
   5 = "secondary"
   6 = "secondary"

[mode.main.binding]
    alt-h = "focus left"
    alt-j = "focus down"
    alt-k = "focus up"
    alt-l = "focus right"
    alt-shift-h = "move left"
    alt-shift-j = "move down"
    alt-shift-k = "move up"
    alt-shift-l = "move right"
    alt-1 = "workspace 1"
    alt-2 = "workspace 2"
    alt-3 = "workspace 3"
    alt-4 = "workspace 4"
    alt-5 = "workspace 5"
	alt-6 = "workspace 6"
    alt-shift-1 = "move-node-to-workspace 1"
    alt-shift-2 = "move-node-to-workspace 2"
    alt-shift-3 = "move-node-to-workspace 3"
    alt-shift-4 = "move-node-to-workspace 4"
	alt-shift-5 = "move-node-to-workspace 5"
    alt-shift-6 = "move-node-to-workspace 6"

[[on-window-detected]]
if.app-id="com.mitchellh.ghostty"
run= [
  "layout floating",
]

